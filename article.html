<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Akademik | DRW Ashari</title>

    <!-- CSS Bootstrap & FontAwesome -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <style>
      /* Desain tipografi khusus untuk kenyamanan membaca opini akademik */
      .article-content {
        font-size: 1.1rem;
        line-height: 1.8;
        color: #333;
      }
      .article-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1.5rem 0;
      }
      .article-content blockquote {
        border-left: 4px solid #0d6efd;
        padding-left: 1.5rem;
        color: #6c757d;
        font-style: italic;
        background-color: #f8f9fa;
        padding: 1rem;
        border-radius: 0 8px 8px 0;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Navigasi -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Denny R.W.A.</a>
        <a href="index.html#blog" class="btn btn-outline-light btn-sm"
          ><i class="fa-solid fa-arrow-left me-2"></i>Kembali ke Beranda</a
        >
      </div>
    </nav>

    <!-- Area Konten Artikel -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8" id="article-container">
          <!-- Indikator Loading -->
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-3">
              Sedang mengambil artikel dari server...
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Script Bootstrap & Aplikasi -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/assets/theme.js"></script>
    <script type="module" src="src/assets/article.js"></script>
  </body>
</html>
